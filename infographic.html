<!DOCTYPE html>
<html>
  <head>
    <title>Interactive Infographic</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        font-family: sans-serif;
        background-color: #f4f4f9; /* A soft off-white background is great for infographics */
      }

      header {
        background-color: royalblue;
        color: white;
        padding: 20px;
      }
      
      h1 {
        font-size: 40px;
        margin: 0;
        font-family: 'Montserrat', sans-serif;
      }

      header p {
        font-size: 16px;
        font-style: italic;
        color: lightgray;
        margin: 0;
      }

      .infographic-container {
        padding: 40px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Interactive Infographic</h1>
      <p>Created by Jayden Joseph.</p>
    </header>
    
    <div class="infographic-container">
      <h2>[Your Infographic Will Go Here]</h2>
      <p>Once you select an idea, we will build the interactive timeline, map, or step-through sequence right here.</p>
    </div>
  </body>
</html>

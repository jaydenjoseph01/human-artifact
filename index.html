<!DOCTYPE html>
<html>
  <head>
    <title>Human Artifact</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        font-family: 'Montserrat', sans-serif;
        background-color: white; 
        color: #333;
        min-height: 100vh;
      }

      header {
        background: linear-gradient(135deg, royalblue 0%, #0c2054 100%);
        color: white; 
        padding: 40px 20px;
        text-align: center;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      }

      h1 {
        font-size: 48px;
        margin: 0 0 10px 0;
        font-weight: 700;
        letter-spacing: -1px;
      }

      header p {
        font-size: 18px;
        font-style: italic;
        color: rgba(255, 255, 255, 0.8);
        margin: 0;
      }

      .content-container {
        padding: 60px 20px;
        text-align: center;
        max-width: 900px;
        margin: 0 auto;
      }

      .main-card {
        background: linear-gradient(135deg, royalblue 0%, #0c2054 100%);
        border-radius: 12px;
        padding: 60px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        transition: box-shadow 0.3s ease;
      }

      .main-card p {
        font-size: 18px;
        color: rgba(255, 255, 255, 0.9); 
        line-height: 1.6;
        margin: 0 auto 30px auto;
        max-width: 600px;
      }

      .info-button {
        display: inline-block;
        background-color: white; 
        color: royalblue; 
        text-decoration: none;
        padding: 15px 30px;
        font-size: 18px;
        font-family: 'Montserrat', sans-serif;
        font-weight: bold;
        border-radius: 5px;
        transition: background-color 0.2s ease, transform 0.2s ease;
      }

      .info-button:hover {
        background-color: #f0f0f0; 
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Human Artifact</h1>
      <p>Created by Jayden Joseph</p>
    </header>
    
    <div class="content-container">
      <div class="main-card">
        <p>Hello, welcome to my human artifact page. Over time this will grow based on my research on technology, and our connection to it as humans.</p>
        <a href="infographic.html" target="_blank" class="info-button">View Infographic ➔</a>
      </div>
    </div>
  </body>
</html>
